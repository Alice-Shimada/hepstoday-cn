name: Data manifest regression tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run.yml'
      - '.github/workflows/maintain-data-index.yml'
      - '.github/workflows/data-manifest-test.yml'
      - 'tests/test_*.py'
      - 'daily_arxiv/daily_arxiv/pipelines.py'
      - 'daily_arxiv/daily_arxiv/check_crawl.py'
      - 'daily_arxiv/daily_arxiv/settings.py'
      - 'daily_arxiv/daily_arxiv/spiders/arxiv.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - '.github/workflows/run.yml'
      - '.github/workflows/maintain-data-index.yml'
      - '.github/workflows/data-manifest-test.yml'
      - 'tests/test_*.py'
      - 'daily_arxiv/daily_arxiv/pipelines.py'
      - 'daily_arxiv/daily_arxiv/check_crawl.py'
      - 'daily_arxiv/daily_arxiv/settings.py'
      - 'daily_arxiv/daily_arxiv/spiders/arxiv.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv sync --locked
      - name: Test crawl completeness and publication manifests
        run: .venv/bin/python -B -m unittest discover -s tests -v
